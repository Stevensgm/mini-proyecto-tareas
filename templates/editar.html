<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificar tarea</title>
    <style>
        :root {
            --ink: #203630;
            --muted: #6c7d76;
            --line: #dce6e0;
            --green: #176b57;
            --orange: #df713e;
            --orange-dark: #c55d30;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            place-items: center;
            background: linear-gradient(135deg, #f5f1e8, #e9f1ec);
            color: var(--ink);
            font-family: "Segoe UI", Tahoma, sans-serif;
        }

        main {
            width: min(100%, 560px);
            padding: 36px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 18px 50px rgba(32, 54, 48, 0.1);
        }

        .sobretitulo {
            margin: 0 0 8px;
            color: var(--green);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.4px;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 10px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 32px;
            font-weight: 600;
        }

        .descripcion {
            margin: 0 0 24px;
            color: var(--muted);
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd8d1;
            border-radius: 5px;
            color: var(--ink);
            font: inherit;
        }

        input:focus {
            border-color: var(--green);
            outline: 3px solid rgba(23, 107, 87, 0.12);
        }

        .acciones {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button,
        .cancelar {
            display: inline-flex;
            min-height: 42px;
            align-items: center;
            justify-content: center;
            padding: 10px 15px;
            border: 0;
            border-radius: 5px;
            font: inherit;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        button {
            background: var(--orange);
            color: #fff;
        }

        button:hover {
            background: var(--orange-dark);
        }

        .cancelar {
            border: 1px solid var(--line);
            background: #fff;
            color: var(--ink);
        }

        @media (max-width: 480px) {
            main {
                padding: 26px 22px;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <main>
        <p class="sobretitulo">Lista de tareas</p>
        <h1>Modificar tarea</h1>
        <p class="descripcion">Cambia el texto y guarda la actualización.</p>

        <form action="" method="POST">
            <label for="tarea">Tarea</label>
            <input id="tarea" type="text" name="tarea" value="{{ tarea }}" required autofocus>
            <div class="acciones">
                <button type="submit">Guardar cambios</button>
                <a class="cancelar" href="/">Cancelar</a>
            </div>
        </form>
    </main>
</body>
</html>
