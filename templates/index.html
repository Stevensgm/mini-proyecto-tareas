<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tareas</title>

    <style>
        :root {
            color-scheme: light;
            --ink: #203630;
            --muted: #6c7d76;
            --line: #dce6e0;
            --paper: #ffffff;
            --green: #176b57;
            --green-dark: #105342;
            --orange: #df713e;
            --orange-dark: #c55d30;
            --blue: #315f91;
            --red: #a9443f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Tahoma, sans-serif;
            color: var(--ink);
            background: linear-gradient(135deg, #f5f1e8 0%, #f7f8f4 52%, #e9f1ec 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 64px 24px;
        }

        .contenedor {
            background: var(--paper);
            width: min(100%, 780px);
            padding: 36px 40px;
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: 0 18px 50px rgba(32, 54, 48, 0.08);
        }

        .encabezado {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            padding-bottom: 26px;
            border-bottom: 1px solid var(--line);
        }

        .sobretitulo {
            margin-bottom: 8px;
            color: var(--green);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.4px;
            text-transform: uppercase;
        }

        h1 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 34px;
            font-weight: 600;
            line-height: 1.15;
        }

        .contador {
            flex: 0 0 auto;
            padding: 7px 11px;
            border: 1px solid var(--line);
            border-radius: 999px;
            color: var(--muted);
            font-size: 13px;
        }

        .formulario-nueva {
            display: flex;
            gap: 12px;
            margin: 26px 0 30px;
        }

        input {
            min-width: 0;
            flex: 1;
            padding: 12px 14px;
            border: 1px solid #cbd8d1;
            border-radius: 5px;
            background: #fcfdfc;
            color: var(--ink);
            font: inherit;
            transition: border-color 150ms ease, box-shadow 150ms ease;
        }

        input:focus {
            border-color: var(--green);
            outline: none;
            box-shadow: 0 0 0 3px rgba(23, 107, 87, 0.12);
        }

        button {
            border: 0;
            border-radius: 5px;
            background: var(--orange);
            color: #fff;
            padding: 11px 17px;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: background 150ms ease, transform 150ms ease;
        }

        button:hover {
            background: var(--orange-dark);
        }

        button:active {
            transform: translateY(1px);
        }

        ul {
            list-style: none;
        }

        li {
            padding: 14px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 18px;
            border-bottom: 1px solid var(--line);
        }

        li:first-child {
            border-top: 1px solid var(--line);
        }

        .texto-tarea {
            min-width: 120px;
            overflow-wrap: anywhere;
            font-size: 15px;
            line-height: 1.5;
        }

        .texto-tarea::before {
            display: inline-block;
            width: 9px;
            height: 9px;
            margin-right: 11px;
            border-radius: 50%;
            background: #e8a54b;
            content: "";
        }

        .acciones {
            display: flex;
            flex: 0 0 auto;
            gap: 9px;
            align-items: center;
        }

        .editar-link {
            padding: 8px 10px;
            border: 1px solid #d7e3ef;
            border-radius: 5px;
            background: #f0f5fa;
            color: var(--blue);
            font-size: 14px;
            text-decoration: none;
            transition: background 150ms ease;
        }

        .editar-link:hover {
            background: #e4edf6;
        }

        .eliminar {
            padding: 8px 10px;
            border: 1px solid #edd4d1;
            border-radius: 5px;
            color: var(--red);
            background: #fff;
            font-size: 14px;
            text-decoration: none;
            transition: background 150ms ease;
        }

        .eliminar:hover {
            background: #fbf1f0;
        }

        .vacio {
            padding: 28px 12px;
            border: 1px dashed #cbd8d1;
            border-radius: 5px;
            color: var(--muted);
            text-align: center;
            font-size: 14px;
        }

        @media (max-width: 620px) {
            body {
                padding: 24px 14px;
            }

            .contenedor {
                padding: 25px 20px;
            }

            .encabezado {
                align-items: flex-start;
            }

            h1 {
                font-size: 29px;
            }

            li {
                align-items: flex-start;
                flex-direction: column;
                gap: 10px;
            }

            .acciones {
                width: 100%;
            }

            .acciones > a {
                text-align: center;
            }
        }

        @media (max-width: 420px) {
            .formulario-nueva {
                flex-direction: column;
            }

            .formulario-nueva button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="contenedor">
    <header class="encabezado">
        <div>
            <p class="sobretitulo">Organización personal</p>
            <h1>Lista de tareas</h1>
        </div>
        <span class="contador">{{ tareas|length }} {% if tareas|length == 1 %}tarea{% else %}tareas{% endif %}</span>
    </header>

    <form class="formulario-nueva" action="/crear" method="POST">
        <input type="text" name="tarea" placeholder="Agregar tareas" aria-label="Nueva tarea" required>
        <button type="submit">Agregar</button>
    </form>

    <ul>
        {% for tarea in tareas %}
        <li>
            <span class="texto-tarea">{{ tarea }}</span>
            <div class="acciones">
                <a class="editar-link" href="/editar/{{ loop.index0 }}" target="_blank" rel="noopener">Modificar</a>
                <a class="eliminar" href="/eliminar/{{ loop.index0 }}">Eliminar</a>
            </div>
        </li>
        {% else %}
        <li class="vacio">Todavía no hay tareas. Agrega la primera arriba.</li>
        {% endfor %}
    </ul>

</div>

</body>
</html>
